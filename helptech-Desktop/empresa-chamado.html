<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamado | Help Tech Express - Empresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Inter:wght@400;500;600&family=New+Amsterdam&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/empresa.css">
</head>
<body class="empresa" data-page="e-chamado">
<div class="layout">
  <aside class="sidebar">
    <div class="user"><small>Técnico</small><span class="name" id="who">-</span></div>
    <nav class="nav" aria-label="Empresa">
      <a href="empresa-painel.html"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg><span>Painel</span></a>
      <a href="empresa-chamados.html" class="active" aria-current="page"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span>Chamados</span></a>
      <a href="index.html"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg><span>Área do cliente</span></a>
      <button type="button" id="sair"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sair</span></button>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar"><div class="e-logo-box"><span class="badge-emp">Área da empresa</span></div><img class="logo" src="img/logo.png" alt="Help Tech Express" width="223" height="59"></header>
    <a class="back-link" href="empresa-chamados.html">&larr; Voltar para os chamados</a>
    <h1 class="page-title" id="titulo" style="margin-top:6px">Chamado</h1>
    <div id="detail" class="detail">
      <section class="box" id="b-cliente"><h2>Cliente</h2></section>
      <section class="box" id="b-problema"><h2>Problema</h2></section>
      <form class="box mgmt full" id="mgmt" novalidate>
        <h2>Atendimento</h2>
        <div class="field"><label for="m-tec">Técnico responsável</label><select id="m-tec"></select></div>
        <div class="field"><label for="m-status">Status</label><select id="m-status"></select></div>
        <div class="field"><label for="m-orc">Orçamento (R$)</label><input id="m-orc" type="text" inputmode="decimal" placeholder="Ex: 150,00"></div>
        <div class="field"><label for="m-note">Registrar andamento (o cliente verá)</label><textarea id="m-note" maxlength="300" placeholder="Ex: Peça pedida, previsão de 2 dias."></textarea></div>
        <div class="row"><button class="btn btn-gray" type="button" id="btn-assumir" style="min-width:160px">Assumir para mim</button><button class="btn btn-blue" type="submit">Salvar</button></div>
      </form>
      <section class="box full"><h2>Histórico</h2><ul class="timeline" id="timeline"></ul></section>
    </div>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/empresa.js"></script>
</body>
</html>
